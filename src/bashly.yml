name: postgres-manager
help: |-
  PostgreSQL manager for Debian/Ubuntu servers: status, databases, users (incl. read-only), extensions and pgBackRest point-in-time recovery.
  Works nicely with Laravel Forge (discovers apps from /home/*/*/.env). Run as root.
version: 0.3.0

examples:
- sudo postgres-manager
- sudo postgres-manager setup
- sudo postgres-manager db create shop --owner shop
- sudo postgres-manager user create metabase --read-only shop,crm
- sudo postgres-manager restore --time "2026-11-05 10:42"

commands:
- name: menu
  default: true
  help: Status dashboard and interactive menu

- name: status
  help: Show system, PostgreSQL, WAL archiving and backup status

- name: db
  alias: databases
  help: List, create and drop databases (interactive menu without a subcommand)
  commands:
  - name: menu
    default: force
    private: true
    help: Interactive database menu
  - name: list
    alias: ls
    help: Databases with size, owner, sessions, read-only users and apps
  - name: create
    help: Create a database owned by a user (the user is created with a generated password if missing)
    args:
    - name: name
      help: Database name (lowercase letters, digits, _); prompted if omitted
    flags:
    - long: --owner
      arg: user
      help: Owner user (default = database name)
    examples:
    - postgres-manager db create shop
    - postgres-manager db create shop --owner forge
  - name: drop
    help: Drop a database (terminates its sessions; typed confirmation)
    args:
    - name: name
      help: Database name; prompted if omitted
    flags:
    - &yes
      long: --yes
      short: -y
      help: Skip confirmations

- name: user
  alias: users
  help: List, create and drop users, read-only access and passwords (interactive menu without a subcommand)
  commands:
  - name: menu
    default: force
    private: true
    help: Interactive user menu
  - name: list
    alias: ls
    help: Users with flags, owned databases, read-only access, sessions and apps
  - name: create
    help: Create a login user (password generated and shown once unless --password-stdin)
    args:
    - name: name
      help: User name (lowercase letters, digits, _); prompted if omitted
    flags:
    - long: --read-only
      arg: databases
      help: Make it a read-only user with SELECT on these databases (comma-separated, or 'all')
    - &pwstdin
      long: --password-stdin
      help: Read the password from the first line of stdin
    examples:
    - postgres-manager user create metabase --read-only shop,crm
    - postgres-manager user create analyst --read-only all
    - echo "$PASS" | postgres-manager user create deploy --password-stdin
  - name: password
    alias: passwd
    help: Set a new password (generated and shown once unless --password-stdin)
    args:
    - name: name
      help: User name; prompted if omitted
    flags:
    - *pwstdin
    - *yes
  - name: grant
    help: Grant read-only access (SELECT on all tables, incl. future ones) on databases
    args:
    - name: name
      help: User name; prompted if omitted
    - name: databases
      help: Comma-separated databases or 'all'; prompted if omitted
    examples:
    - postgres-manager user grant metabase shop,crm
  - name: revoke
    help: Revoke read-only access on databases
    args:
    - name: name
      help: User name; prompted if omitted
    - name: databases
      help: Comma-separated databases or 'all'; prompted if omitted
  - name: drop
    help: Drop a user (refuses while it owns databases; typed confirmation)
    args:
    - name: name
      help: User name; prompted if omitted
    flags:
    - *yes

- name: extensions
  alias: ext
  help: Install and enable PostGIS, pgvector, TimescaleDB, pg_cron and pg_stat_statements (packages, preload, CREATE EXTENSION)

- name: setup
  help: Configure pgBackRest backups and WAL archiving (Cloudflare R2, S3 or a local directory)

- name: edit
  help: Change backup schedule, retention, RPO (max. data loss), performance, repository or heartbeat URL

- name: list
  alias: ls
  help: List backup sets (type, time, size) and the point-in-time recovery window
  dependencies: &backup_deps
    pgbackrest: run 'postgres-manager setup' first
    jq: run 'postgres-manager setup' first

- name: backup
  help: Run a backup now (full = everything, diff = changes since the last full, incr = changes since the last backup)
  dependencies: *backup_deps
  args:
  - name: type
    help: Backup type
    default: diff
    allowed: [full, diff, incr]
  examples:
  - postgres-manager backup
  - postgres-manager backup full

- name: check
  help: Run pgBackRest's check - a test WAL segment is archived and the repository is reachable
  dependencies: *backup_deps

- name: verify
  help: Restore drill - proves the backups can be restored. Restores the latest backup with all WAL into a temporary directory, starts it, compares databases and sizes with the live cluster, then removes it
  dependencies: *backup_deps
  flags:
  - long: --keep
    help: Keep the restored copy running for inspection

- name: restore
  help: Restore or point-in-time recovery (interactive without flags)
  dependencies: *backup_deps
  flags:
  - long: --time
    arg: timestamp
    help: Recover to this point in time (server timezone unless given)
    conflicts: [--set]
  - long: --set
    arg: label
    help: Recover to the end of this backup set (see 'list')
  - long: --target-dir
    arg: dir
    help: Restore into this directory as a standalone copy instead of replacing the live cluster
  - *yes
  examples:
  - postgres-manager restore
  - postgres-manager restore --time "2026-11-05 10:42" --target-dir /var/lib/postgresql/pitr
  - postgres-manager restore --set 20261105-013001F --yes

- name: self-update
  help: Update postgres-manager from GitHub

- name: cron-backup
  private: true
  help: Scheduled backup with heartbeat ping (called from cron)
  dependencies: *backup_deps
  args:
  - name: type
    required: true
    allowed: [full, diff, incr]
