name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated script is up to date with src/
        run: |
          make build
          git diff --exit-code -- postgres-manager || {
            echo "::error file=postgres-manager::postgres-manager is out of date - run 'make build' and commit it"
            exit 1
          }
      - name: shellcheck
        run: make lint

  test:
    name: E2E ${{ matrix.image }}
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:13', 'ubuntu:22.04', 'ubuntu:24.04']
    steps:
      - uses: actions/checkout@v4
      - name: Test suites in ${{ matrix.image }}
        run: bash test/run.sh '${{ matrix.image }}'
