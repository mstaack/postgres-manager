# bashly settings — https://bashly.dev/usage/settings/
source_dir: src
target_dir: .
lib_dir: lib
strict: set -Eeuo pipefail
formatter: internal
env: development
show_examples_on_error: true
enable_view_markers: development
enable_inspect_args: development
enable_sourcing: never
enable_deps_array: never
enable_env_var_names_array: never
